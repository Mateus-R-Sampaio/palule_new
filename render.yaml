# Blueprint do Render (render.com): cria o banco PostgreSQL + o serviço web.
# Dashboard → New → Blueprint → selecione este repositório.
databases:
  - name: studio-db
    databaseName: studio
    user: studio
    plan: basic-256mb
    ipAllowList: [] # banco acessível só pela rede interna do Render

services:
  - type: web
    name: studio-personalizado
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: studio-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: IP_HASH_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://mateus-r-sampaio.github.io
      - key: EMAIL_PROVIDER
        value: none
      - key: MESSAGE_PROVIDER
        value: none
