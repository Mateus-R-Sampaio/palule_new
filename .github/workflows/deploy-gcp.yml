# Testa e publica no Google (Cloud Run + Firebase Hosting) a cada push no main.
# A publicação só acontece depois de configurar: bash deploy/setup-github-deploy.sh
name: Testar e publicar no Google

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testes de segurança e regras
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio_ci_pw
          POSTGRES_DB: studio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://studio:studio_ci_pw@localhost:5432/studio_test
      - run: npm audit --omit=dev --audit-level=high
        working-directory: server

  deploy:
    name: Publicar no Google
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # login no Google sem chave (Workload Identity Federation)
    environment:
      name: producao
      url: https://${{ vars.GCP_PROJECT_ID }}.web.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publicar o servidor (Cloud Run)
        # Sem outras flags: herda banco, segredos e variáveis da versão anterior.
        # As migrações do banco rodam quando o servidor inicia.
        run: gcloud run deploy studio-personalizado --source . --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --quiet

      - name: Conferir se o site respondeu
        run: |
          URL=$(gcloud run services describe studio-personalizado --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          curl -fsS "$URL/api/health"

      - name: Publicar o Firebase Hosting (só se o firebase.json mudou)
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qx firebase.json; then
            npx --yes firebase-tools@13 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
          else
            echo "firebase.json não mudou: o Hosting continua apontando para o Cloud Run."
          fi
