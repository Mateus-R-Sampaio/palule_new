# Publica o site estático no GitHub Pages a cada push no main.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar a pasta do site
        run: |
          mkdir -p _site
          cp -r index.html admin.html styles.css admin.css manifest.json sw.js icon.svg js _site/
          # A loja do Pages conversa com o servidor (API + banco). Defina a variável do
          # repositório STUDIO_API_BASE (Settings → Secrets and variables → Actions → Variables).
          if [ -n "$STUDIO_API_BASE" ]; then
            printf 'export const API_BASE = "%s";\n' "$STUDIO_API_BASE" > _site/js/config.js
          fi
          touch _site/.nojekyll
        env:
          STUDIO_API_BASE: ${{ vars.STUDIO_API_BASE }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
